{{- /*
  Continuous backup (base backup + WAL) of the CNPG cluster via the Barman Cloud plugin.
  The bucket must exist; the credentials live in a Secret that does NOT come from this chart
  (never in Git). Folder in the bucket = serverName of the cluster (= cnpg.name).
  `configuration.serverName` stays empty (upstream keeps it for API compatibility only).
*/ -}}
{{- if and .Values.cnpg.enabled .Values.cnpg.backup.enabled }}
{{- $c := .Values.cnpg }}
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: {{ $c.name }}-backup-store
  namespace: {{ .Release.Namespace }}
spec:
  retentionPolicy: {{ $c.backup.retentionPolicy | quote }}
  configuration:
    destinationPath: {{ required "cnpg.backup.destinationPath is required" $c.backup.destinationPath | quote }}
    endpointURL: {{ required "cnpg.backup.endpointURL is required" $c.backup.endpointURL | quote }}
    s3Credentials:
      accessKeyId:
        name: {{ required "cnpg.backup.credentialsSecret is required" $c.backup.credentialsSecret | quote }}
        key: {{ $c.backup.accessKeyIdKey | quote }}
      secretAccessKey:
        name: {{ $c.backup.credentialsSecret | quote }}
        key: {{ $c.backup.secretAccessKeyKey | quote }}
      {{- with $c.backup.regionKey }}
      region:
        name: {{ $c.backup.credentialsSecret | quote }}
        key: {{ . | quote }}
      {{- end }}
    wal:
      compression: gzip
    data:
      compression: gzip
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: {{ $c.name }}-daily
  namespace: {{ .Release.Namespace }}
spec:
  # 6-field cron (with seconds!), UTC.
  schedule: {{ $c.backup.schedule | quote }}
  backupOwnerReference: self
  immediate: true
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  cluster:
    name: {{ $c.name }}
{{- end }}
