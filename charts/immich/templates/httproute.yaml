{{- if .Values.httpRoute.enabled }}
{{- $r := .Values.httpRoute }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ required "httpRoute.parentRef.name is required" $r.parentRef.name }}
      namespace: {{ required "httpRoute.parentRef.namespace is required" $r.parentRef.namespace }}
      sectionName: {{ required "httpRoute.parentRef.sectionName must select the HTTPS listener" $r.parentRef.sectionName }}
  hostnames:
    {{- toYaml (required "httpRoute.hostnames is required" $r.hostnames) | nindent 4 }}
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - name: {{ $r.backendServiceName | default (printf "%s-server" .Release.Name) }}
          port: 2283
      timeouts:
        request: {{ $r.requestTimeout | quote }}
{{- end }}
