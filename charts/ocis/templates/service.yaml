apiVersion: v1
kind: Service
metadata:
  name: {{ include "ocis.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ocis.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "ocis.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 9200
      targetPort: http
      protocol: TCP
