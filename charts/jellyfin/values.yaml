jellyfin:

  # Optional: media and configuration from an existing NFS export. The chart then creates one
  # PersistentVolume (Retain) plus a matching claim for each; `persistence.*.existingClaim` names
  # the claim (see the README example). Without NFS the upstream chart uses its default persistence
  # via the cluster's StorageClass.
  nfs:
    enabled: false
    server: ""          # required when a volume is enabled, e.g. 192.0.2.10
    media:
      enabled: false
      path: ""          # e.g. /export/jellyfin/media
      size: 100Gi
    config:
      enabled: false
      path: ""          # e.g. /export/jellyfin/config
      size: 5Gi

  serviceAccount:
    create: false
    automount: false

  # Pinned tag instead of the upstream chart's default. The image tag and `appVersion` in
  # Chart.yaml move together (tools/check_chart.py checks this).
  image:
    tag: "12.1"

  # Headroom for occasional transcoding. Deliberately NO CPU limit: Jellyfin transcodes in
  # software, a 1080p transcode can need more than 2 cores — a limit would throttle it and the
  # video stutters. The request reserves the baseline; the memory limit protects the node.
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 2Gi

  # Recreate instead of RollingUpdate: a rolling update starts the new pod NEXT TO the old one, and
  # two Jellyfin instances then work on the same database. `rollingUpdate: null` because the API
  # server would otherwise fill in defaults that are invalid with Recreate.
  deploymentStrategy:
    type: Recreate
    rollingUpdate: null

  # Probes with headroom: a 1 s timeout is too tight under load (transcoding, library scans).
  # Startup: 10 minutes for the first start after an update that migrates the database.
  livenessProbe:
    timeoutSeconds: 5
    failureThreshold: 5
  readinessProbe:
    timeoutSeconds: 5
  startupProbe:
    failureThreshold: 60

# HTTPRoute on a Gateway (Gateway API, templates/httproute.yaml). Off by default. `sectionName`
# (the HTTPS listener) is required; streams need a long `timeouts.request`.
httpRoute:
  enabled: false
  parentRef: {}
  #   name: my-gateway
  #   namespace: gateway-system
  #   sectionName: https
  routes: []
