{{- /*
  HTTPRoute(s) am geteilten Envoy-Gateway (Gateway API).

  Die App dockt am Wildcard-Listener ihrer Domain an (Gateway-API: ein Gateway mit Wildcard-Listener je Domain): nur die Route, kein Listener, kein Zertifikat, kein ReferenceGrant.

  - sectionName ist Pflicht: Ohne ihn hinge die Route auch am HTTP-Listener und umginge die
    Umleitung auf https.
  - Envoy nimmt ohne `timeouts.request` 15 s; lange Anfragen (Uploads, Streams) brauchen einen
    eigenen Wert in der Regel.
  - `rules` stehen wörtlich in den Werten (matches, backendRefs, timeouts) — so, wie sie die Route
    braucht, ohne Übersetzung durch die Vorlage.
*/ -}}
{{- if .Values.httpRoute.enabled }}
{{- range $route := .Values.httpRoute.routes }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ required "httpRoute.routes[].name fehlt" $route.name }}
  namespace: {{ $.Release.Namespace }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ required "httpRoute.parentRef.name fehlt" $.Values.httpRoute.parentRef.name }}
      namespace: {{ required "httpRoute.parentRef.namespace fehlt" $.Values.httpRoute.parentRef.namespace }}
      sectionName: {{ required "httpRoute.parentRef.sectionName fehlt (sonst umgeht die Route die Umleitung auf https)" $.Values.httpRoute.parentRef.sectionName }}
  hostnames:
    {{- toYaml (required "httpRoute.routes[].hostnames fehlt" $route.hostnames) | nindent 4 }}
  rules:
    {{- toYaml (required "httpRoute.routes[].rules fehlt" $route.rules) | nindent 4 }}
{{- end }}
{{- end }}
