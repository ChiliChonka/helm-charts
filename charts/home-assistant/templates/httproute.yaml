{{- /*
  HTTPRoute(s) attached to a shared Gateway (Gateway API).

  The app attaches to the wildcard listener of its domain: only the route, no listener, no
  certificate, no ReferenceGrant.

  - sectionName is required: without it the route would also attach to the HTTP listener and
    bypass the redirect to HTTPS.
  - Envoy Gateway applies a 15 s request timeout unless `timeouts.request` is set; long requests
    (uploads, streams) need their own value.
  - `rules` are taken verbatim from the values (matches, backendRefs, timeouts) — exactly as the
    route needs them, without translation by the template.
*/ -}}
{{- if .Values.httpRoute.enabled }}
{{- range $route := .Values.httpRoute.routes }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ required "httpRoute.routes[].name is required" $route.name }}
  namespace: {{ $.Release.Namespace }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ required "httpRoute.parentRef.name is required" $.Values.httpRoute.parentRef.name }}
      namespace: {{ required "httpRoute.parentRef.namespace is required" $.Values.httpRoute.parentRef.namespace }}
      sectionName: {{ required "httpRoute.parentRef.sectionName is required (otherwise the route bypasses the HTTPS redirect)" $.Values.httpRoute.parentRef.sectionName }}
  hostnames:
    {{- toYaml (required "httpRoute.routes[].hostnames is required" $route.hostnames) | nindent 4 }}
  rules:
    {{- toYaml (required "httpRoute.routes[].rules is required" $route.rules) | nindent 4 }}
{{- end }}
{{- end }}
