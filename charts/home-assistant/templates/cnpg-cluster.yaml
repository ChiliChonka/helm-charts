{{- /*
  Home Assistant recorder database via CloudNativePG — instead of SQLite on NFS (file locking over
  NFS is unreliable).

  - CNPG creates the credentials in the Secret `<name>-app` (key `uri` = complete postgresql://
    URL); Home Assistant reads it via env.valueFrom, never through the values.
  - Home Assistant creates the schema itself on first start.
  - Backup via the Barman Cloud plugin: ObjectStore and ScheduledBackup in cnpg-backup.yaml.
*/ -}}
{{- if .Values.cnpg.enabled }}
{{- $c := .Values.cnpg }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ $c.name }}
  namespace: {{ .Release.Namespace }}
spec:
  instances: {{ $c.instances }}
  imageName: {{ required "cnpg.image is required (pinned tag)" $c.image }}
  storage:
    size: {{ $c.storageSize }}
  {{- with $c.resources }}
  resources:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $c.parameters }}
  postgresql:
    parameters:
      {{- toYaml . | nindent 6 }}
  {{- end }}
  {{- if $c.backup.enabled }}
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: {{ $c.name }}-backup-store
        serverName: {{ $c.name }}
  {{- end }}
  bootstrap:
    initdb:
      database: {{ $c.database | quote }}
      owner: {{ $c.owner | quote }}
{{- end }}
