{{- /*
  Kontinuierliche Sicherung (Base-Backup + WAL) des CNPG-Clusters über das Barman-Cloud-Plugin,
  Der Bucket muss existieren; die Zugangsdaten liegen in einem
  Secret, das NICHT aus dem Chart kommt (nie in Git). Unterordner im Bucket = serverName am
  Cluster (= cnpg.name). `configuration.serverName` bleibt leer (upstream nur API-Kompatibilität).
*/ -}}
{{- if and .Values.cnpg.enabled .Values.cnpg.backup.enabled }}
{{- $c := .Values.cnpg }}
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: {{ $c.name }}-backup-store
  namespace: {{ .Release.Namespace }}
spec:
  retentionPolicy: {{ $c.backup.retentionPolicy | quote }}
  configuration:
    destinationPath: {{ required "cnpg.backup.destinationPath fehlt" $c.backup.destinationPath | quote }}
    endpointURL: {{ required "cnpg.backup.endpointURL fehlt" $c.backup.endpointURL | quote }}
    s3Credentials:
      accessKeyId:
        name: {{ required "cnpg.backup.credentialsSecret fehlt" $c.backup.credentialsSecret | quote }}
        key: {{ $c.backup.accessKeyIdKey | quote }}
      secretAccessKey:
        name: {{ $c.backup.credentialsSecret | quote }}
        key: {{ $c.backup.secretAccessKeyKey | quote }}
    wal:
      compression: gzip
    data:
      compression: gzip
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: {{ $c.name }}-daily
  namespace: {{ .Release.Namespace }}
spec:
  # 6-Feld-Cron (mit Sekunden!), UTC.
  schedule: {{ $c.backup.schedule | quote }}
  backupOwnerReference: self
  immediate: true
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  cluster:
    name: {{ $c.name }}
{{- end }}
