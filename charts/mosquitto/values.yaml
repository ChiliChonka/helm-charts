image:
  repository: eclipse-mosquitto
  # Always a string, and always the full patch release. The 2.1 tags exist only with -alpine.
  tag: "2.1.2-alpine"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""

service:
  type: ClusterIP
  annotations: {}

ports:
  mqtt: 1883
  # Only used if the config opens a websocket listener; see README.
  websocket: 9090

# mosquitto.conf as written. Nothing is appended: if auth.existingSecret is set, the config must
# name the file itself (password_file /etc/mosquitto/auth/passwordfile).
config: |
  persistence true
  persistence_location /mosquitto/data/
  log_dest stdout
  listener 1883 0.0.0.0
  listener 9090 0.0.0.0
  protocol websockets
  allow_anonymous false

# Secret with the password file (mosquitto_passwd format). An init container copies it into an
# emptyDir at auth.mountPath, owned by the broker user; see README for why.
auth:
  existingSecret: ""
  secretKey: passwordfile
  mountPath: /etc/mosquitto/auth

# TLS: a kubernetes.io/tls Secret (e.g. from cert-manager) with tls.crt and tls.key. The init
# container copies both into a memory-backed emptyDir at tls.mountPath, owned by the broker user,
# like the password file. Name them in config yourself, after the listener they belong to:
#   listener 8883 0.0.0.0
#   certfile /etc/mosquitto/tls/tls.crt
#   keyfile /etc/mosquitto/tls/tls.key
# and add the port under ports (e.g. mqtts: 8883). A renewed certificate arrives only with a pod
# restart. Empty: no TLS files.
tls:
  existingSecret: ""
  mountPath: /etc/mosquitto/tls

# ACL file content. Not a secret, so it lives here. Copied next to the password file; name it in
# config yourself (acl_file /etc/mosquitto/auth/aclfile). Empty: no file.
acl: ""

# Each TCP probe is a client connect, and with log_type defaults two lines in the broker log.
livenessProbe:
  tcpSocket: {port: websocket}
  initialDelaySeconds: 5
  periodSeconds: 15
  timeoutSeconds: 3
  failureThreshold: 3
readinessProbe:
  tcpSocket: {port: websocket}
  initialDelaySeconds: 3
  # The Service gets the pod only after the first success, which can take a full period.
  periodSeconds: 5
  timeoutSeconds: 3

# fsGroup lets the init container read the Secret (0440) as the broker user.
podSecurityContext:
  fsGroup: 1883
securityContext: {}
resources: {}

persistence:
  enabled: true
  accessMode: ReadWriteOnce
  size: 1Gi
  mountPath: /mosquitto/data
  storageClass: ""
  existingClaim: ""

nodeSelector: {}
tolerations: []
affinity: {}
