tika:
  enabled: true

gotenberg:
  enabled: true

paperless-ngx:
  enabled: true

# --- Platform services via operators ------------
# Replaces the Bitnami subcharts `postgresql` and `redis`. Off by default; enable them in your own
# values file (docs/operators.md lists the operators).

# Postgres via CloudNativePG (templates/cnpg-cluster.yaml, templates/cnpg-backup.yaml).
cnpg:
  enabled: false
  name: paperless-db
  # Pinned tag, e.g. ghcr.io/cloudnative-pg/postgresql:17.11-standard-trixie
  image: ""
  instances: 1
  storageSize: 5Gi
  database: paperless
  owner: paperless
  resources: {}
  parameters: {}
  # Import from an existing database — only applies when the cluster is created.
  import:
    enabled: false
    host: ""
    database: paperless
    user: paperless
    passwordSecret:
      name: ""
      key: ""
  backup:
    enabled: false
    destinationPath: ""
    endpointURL: ""
    credentialsSecret: ""
    accessKeyIdKey: ACCESS_KEY_ID
    secretAccessKeyKey: SECRET_ACCESS_KEY
    # Key in the same Secret that holds the S3 region; empty = not set (client default
    # us-east-1). Stores that check the region in the signature (Garage) answer 400 otherwise:
    # a running cluster retries with the region from the error body, a NEW archive fails on
    # its first HEAD request ("Bad request when accessing bucket").
    regionKey: ""
    retentionPolicy: "30d"
    schedule: "0 30 1 * * *"

# Redis via the OT-CONTAINER-KIT redis-operator (templates/redis.yaml).
redisOperator:
  enabled: false
  name: paperless-redis
  # Fester Tag (quay.io/opstree/redis:<tag>).
  image: ""
  resources: {}

# HTTPRoute(s) on a Gateway (Gateway API). Off by default; see the README for an example.
httpRoute:
  enabled: false
  parentRef: {}
  routes: []
