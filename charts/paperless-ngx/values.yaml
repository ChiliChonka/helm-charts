tika:
  enabled: true

gotenberg:
  enabled: true

paperless-ngx:
  enabled: true

# --- Plattformdienste per Operator ------------
# Löst die Bitnami-Subcharts `postgresql` und `redis` ab. Default aus; Werte für prod in
# einer eigenen Wertedatei.

# Postgres über CNPG (templates/cnpg-cluster.yaml, templates/cnpg-backup.yaml).
cnpg:
  enabled: false
  name: paperless-db
  # Fester Tag, dieselbe Image-Art wie die übrigen CNPG-Cluster im Cluster.
  image: ""
  instances: 1
  storageSize: 5Gi
  database: paperless
  owner: paperless
  resources: {}
  parameters: {}
  # Datenübernahme aus der alten Datenbank — wirkt nur beim Anlegen des Clusters.
  import:
    enabled: false
    host: ""
    database: paperless
    user: paperless
    passwordSecret:
      name: ""
      key: ""
  backup:
    enabled: false
    destinationPath: ""
    endpointURL: ""
    credentialsSecret: ""
    accessKeyIdKey: ACCESS_KEY_ID
    secretAccessKeyKey: SECRET_ACCESS_KEY
    retentionPolicy: "30d"
    schedule: "0 30 1 * * *"

# Redis über den OT-redis-operator (templates/redis.yaml).
redisOperator:
  enabled: false
  name: paperless-redis
  # Fester Tag (quay.io/opstree/redis:<tag>).
  image: ""
  resources: {}

# HTTPRoute(s) am geteilten Envoy-Gateway. Aus per Default;
# eigene Werte siehe README.
httpRoute:
  enabled: false
  parentRef: {}
  routes: []
