{{- /*
  Redis via the OT-CONTAINER-KIT redis-operator, replacing the Bitnami `redis` subchart.
  For paperless it is only the Celery broker: no persistence (no spec.storage).

  Password: without `redisSecret` the instance is reachable without authentication from every
  namespace (verified). The password is generated once and kept on every upgrade via `lookup` —
  never in Git.
*/ -}}
{{- if .Values.redisOperator.enabled }}
{{- $r := .Values.redisOperator }}
{{- $secretName := printf "%s-auth" $r.name }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    # Kept on `helm uninstall`: the password should survive a reinstall.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if and $existing $existing.data (index $existing.data "password") }}
  password: {{ index $existing.data "password" }}
  {{- else }}
  password: {{ randAlphaNum 32 | b64enc }}
  {{- end }}
---
apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: Redis
metadata:
  name: {{ $r.name }}
  namespace: {{ .Release.Namespace }}
spec:
  kubernetesConfig:
    image: {{ required "redisOperator.image is required (pinned tag)" $r.image }}
    imagePullPolicy: IfNotPresent
    redisSecret:
      name: {{ $secretName }}
      key: password
    {{- with $r.resources }}
    resources:
      {{- toYaml . | nindent 6 }}
    {{- end }}
{{- end }}
