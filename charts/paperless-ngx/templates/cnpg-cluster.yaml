{{- /*
  Postgres via CloudNativePG, replacing the Bitnami `postgresql` subchart. The operator runs
  cluster-wide (cnpg-system), the instance lives in the app's namespace.

  - CNPG creates the credentials itself in the Secret `<name>-app` (keys username/password/host …).
    No password in the values.
  - `import` applies ONLY when the cluster is created (bootstrap). It reads the source database via
    pg_dump — the app must not write during the import (scale paperless to 0). Without effect
    afterwards; the values stay in place so the spec does not change.
  - Backup via the Barman Cloud plugin: ObjectStore and ScheduledBackup in cnpg-backup.yaml.
*/ -}}
{{- if .Values.cnpg.enabled }}
{{- $c := .Values.cnpg }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ $c.name }}
  namespace: {{ .Release.Namespace }}
spec:
  instances: {{ $c.instances }}
  imageName: {{ required "cnpg.image is required (pinned tag)" $c.image }}
  storage:
    size: {{ $c.storageSize }}
  {{- with $c.resources }}
  resources:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $c.parameters }}
  postgresql:
    parameters:
      {{- toYaml . | nindent 6 }}
  {{- end }}
  {{- if $c.backup.enabled }}
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: {{ $c.name }}-backup-store
        serverName: {{ $c.name }}
  {{- end }}
  bootstrap:
    initdb:
      database: {{ $c.database | quote }}
      owner: {{ $c.owner | quote }}
      {{- if $c.import.enabled }}
      import:
        type: microservice
        databases:
          - {{ $c.import.database | quote }}
        source:
          externalCluster: import-source
      {{- end }}
  {{- if $c.import.enabled }}
  externalClusters:
    - name: import-source
      connectionParameters:
        host: {{ required "cnpg.import.host is required" $c.import.host | quote }}
        user: {{ $c.import.user | quote }}
        dbname: {{ $c.import.database | quote }}
        sslmode: disable
      password:
        name: {{ required "cnpg.import.passwordSecret.name is required" $c.import.passwordSecret.name | quote }}
        key: {{ required "cnpg.import.passwordSecret.key is required" $c.import.passwordSecret.key | quote }}
  {{- end }}
{{- end }}
