{{- /*
  PAPERLESS_SECRET_KEY — required since paperless-ngx 3, paperless does not start without it.
  Generated once and kept on every upgrade via `lookup`, never in Git (same pattern as
  paperless-redis-auth). A new key only ends browser sessions; API tokens live in the database and
  stay valid.
*/ -}}
{{- $secretName := printf "%s-secret-key" (include "webserver.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "webserver.labels" . | nindent 4 }}
  annotations:
    # Kept on `helm uninstall`: sessions and signed links survive a reinstall.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if and $existing $existing.data (index $existing.data "secret-key") }}
  secret-key: {{ index $existing.data "secret-key" }}
  {{- else }}
  secret-key: {{ randAlphaNum 64 | b64enc }}
  {{- end }}
