{{- /*
  PAPERLESS_SECRET_KEY — ab paperless-ngx 3 Pflicht, ohne ihn startet paperless nicht.
  Einmal erzeugt und per `lookup` bei jedem Upgrade beibehalten, nie in Git (Muster wie
  paperless-redis-auth). Ein neuer Schlüssel beendet nur Browser-Sitzungen; API-Tokens liegen in
  der Datenbank und bleiben gültig.
*/ -}}
{{- $secretName := printf "%s-secret-key" (include "webserver.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "webserver.labels" . | nindent 4 }}
  annotations:
    # Bleibt bei `helm uninstall` stehen: Sitzungen und signierte Links überleben eine Neuinstallation.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if and $existing $existing.data (index $existing.data "secret-key") }}
  secret-key: {{ index $existing.data "secret-key" }}
  {{- else }}
  secret-key: {{ randAlphaNum 64 | b64enc }}
  {{- end }}
