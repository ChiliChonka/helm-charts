{{- /*
  paperless-ngx 3: these variables no longer exist or have been replaced (upstream
  docs/migration-v3.md). The ConfigMap template no longer renders them; a value set there would
  silently have no effect — so rendering fails instead.
  PAPERLESS_SECRET_KEY used to end up in the ConfigMap; it now comes from the Secret
  `<fullname>-secret-key` (templates/secret-key.yaml).
*/ -}}
{{- $replaced := dict
  "PAPERLESS_CONSUMER_POLLING" "PAPERLESS_CONSUMER_POLLING_INTERVAL"
  "PAPERLESS_CONSUMER_INOTIFY_DELAY" "PAPERLESS_CONSUMER_STABILITY_DELAY"
  "PAPERLESS_CONSUMER_POLLING_DELAY" "PAPERLESS_CONSUMER_STABILITY_DELAY"
  "PAPERLESS_CONSUMER_POLLING_RETRY_COUNT" "nothing (removed)"
  "PAPERLESS_CONSUMER_BARCODE_SCANNER" "nothing (zxing only)"
  "PAPERLESS_OCR_SKIP_ARCHIVE_FILE" "PAPERLESS_ARCHIVE_FILE_GENERATION"
  "PAPERLESS_DBSSLMODE" "PAPERLESS_DB_OPTIONS"
  "PAPERLESS_DBSSLROOTCERT" "PAPERLESS_DB_OPTIONS"
  "PAPERLESS_DBSSLCERT" "PAPERLESS_DB_OPTIONS"
  "PAPERLESS_DBSSLKEY" "PAPERLESS_DB_OPTIONS"
  "PAPERLESS_DB_TIMEOUT" "PAPERLESS_DB_OPTIONS"
  "PAPERLESS_SECRET_KEY" "the Secret generated by the chart (never in values)" }}
{{- range $old, $new := $replaced }}
{{- if index $.Values.paperlessVars $old }}
{{- fail (printf "%s is not supported by paperless-ngx 3 in this chart; use %s." $old $new) }}
{{- end }}
{{- end }}
{{- if has (index .Values.paperlessVars "PAPERLESS_OCR_MODE") (list "skip" "skip_noarchive") }}
{{- fail "PAPERLESS_OCR_MODE skip/skip_noarchive were removed in paperless-ngx 3; use auto plus PAPERLESS_ARCHIVE_FILE_GENERATION." }}
{{- end }}
