name: release

# One chart per tag: <directory>-v<version>, e.g. jellyfin-v1.1.0 for charts/jellyfin.
# The version in the tag must match Chart.yaml. Target: oci://ghcr.io/<owner>/charts.
on:
  push:
    tags:
      - "*-v*"

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v5
      - run: pip install pyyaml

      - name: Chart and version from the tag
        id: tag
        run: |
          tag="${GITHUB_REF_NAME}"
          dir="${tag%-v*}"; version="${tag##*-v}"
          test -f "charts/${dir}/Chart.yaml" || { echo "::error::charts/${dir} does not exist"; exit 1; }
          chart_version=$(python3 -c "import yaml;print(yaml.safe_load(open('charts/${dir}/Chart.yaml'))['version'])")
          test "${version}" = "${chart_version}" || { echo "::error::tag ${version} does not match Chart.yaml ${chart_version}"; exit 1; }
          echo "dir=${dir}" >> "$GITHUB_OUTPUT"

      - name: Check all charts
        run: ./scripts/check.sh

      - name: Package and push to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          helm package "charts/${{ steps.tag.outputs.dir }}" --destination dist
          echo "${GHCR_TOKEN}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          helm push dist/*.tgz "oci://ghcr.io/${owner}/charts"
