name: release

# Ein Chart je Tag: <verzeichnis>-v<version>, z. B. jellyfin-v1.1.0 für charts/jellyfin.
# Die Version im Tag muss der in Chart.yaml entsprechen. Ziel: oci://ghcr.io/<owner>/charts.
on:
  push:
    tags:
      - "*-v*"

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: pip install pyyaml

      - name: Chart und Version aus dem Tag
        id: tag
        run: |
          tag="${GITHUB_REF_NAME}"
          dir="${tag%-v*}"; version="${tag##*-v}"
          test -f "charts/${dir}/Chart.yaml" || { echo "::error::charts/${dir} gibt es nicht"; exit 1; }
          chart_version=$(python3 -c "import yaml;print(yaml.safe_load(open('charts/${dir}/Chart.yaml'))['version'])")
          test "${version}" = "${chart_version}" || { echo "::error::Tag ${version} ≠ Chart.yaml ${chart_version}"; exit 1; }
          echo "dir=${dir}" >> "$GITHUB_OUTPUT"

      - name: Alle Charts prüfen
        run: ./scripts/check.sh

      - name: Paketieren und nach GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          helm package "charts/${{ steps.tag.outputs.dir }}" --destination dist
          echo "${GHCR_TOKEN}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          helm push dist/*.tgz "oci://ghcr.io/${owner}/charts"
