name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  charts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - run: pip install pyyaml
      - run: sudo apt-get update -q && sudo apt-get install -y -q sqlite3   # rustical backup tests
      - run: ./scripts/check.sh
